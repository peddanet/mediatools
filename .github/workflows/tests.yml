name: quality-gates

# Branching model (see CONTRIBUTING.md):
#   feature/*  -> merged into develop
#   develop    -> integration; release merge into main
#   main       -> releases only, every release is an annotated tag vX.Y.Z
#
# Which event runs what (see docs/developer.md, "CI runs"):
#   pull_request into main/develop  gates; required check. Since dev-conventions
#                                    bundle v21 tools/release.sh builds merges,
#                                    release commit and tag locally, opens the pull
#                                    request only for these checks and then pushes
#                                    exactly the checked commit to main/develop
#                                    (one CI run per release)
#   push of a tag v*                 release-check only: the tagged commit is the
#                                    one its pull request already tested, so the
#                                    gates would only repeat that run
# Python versions: the oldest supported (requires-python) and the newest; the
# pre-push hook on the developer's PC covers the version in between.
# Branch pushes start no run: work branches are checked through their pull
# request, and the push to main/develop carries the commit its pull request
# already tested (branch protection: required checks from GitHub Actions).
# A branch without a pull request: gh workflow run quality-gates --ref BRANCH
# Every gate is its own step "gate: <name>" (tools/check.sh --only <name>,
# dev-conventions bundle v21, templates/ci.yml), so the GitHub page and the
# watcher of tools/release.sh show which gate runs or failed; the work is the
# same as one tools/check.sh run. With CI=true the privacy scan skips itself
# (no local terms on GitHub) and the check cache always checks in full;
# the tests use all threads of the runner (pytest-xdist; 4 on a public
# repository) and skip the tests of unchanged bundle files
# (tools/bundle.sha256); FORCE_COLOR=1 keeps the colours in the GitHub log.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gates:
    if: github.ref_type != 'tag'
    name: gates (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      CI: "true"
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip                          # pip downloads, keyed on pyproject.toml
          cache-dependency-path: pyproject.toml
      - name: system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rsync rsnapshot xvfb shellcheck
      - name: python tools
        run: pip install -e ".[dev]"
      - name: "gate: privacy"
        run: tools/check.sh --only privacy
      - name: "gate: shell"
        run: tools/check.sh --only shell
      - name: "gate: format"
        run: tools/check.sh --only format
      - name: "gate: lint"
        run: tools/check.sh --only lint
      - name: "gate: types"
        run: tools/check.sh --only types
      - name: "gate: security"
        run: tools/check.sh --only security
      - name: "gate: tests"
        run: tools/check.sh --only tests

  release-check:
    # A tag must point to a commit on main and match __version__.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: tag matches version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mediatools/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
