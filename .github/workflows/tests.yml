name: quality-gates

# Branching model (see CONTRIBUTING.md):
#   feature/*  -> pull request into develop
#   develop    -> integration; release merge into main
#   main       -> releases only, every release is an annotated tag vX.Y.Z
on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rsync rsnapshot
      - name: python tools
        run: pip install -e ".[dev]"
      - name: quality gates (format, lint, types, security, tests)
        run: tools/check.sh

  release-check:
    # A tag must point to a commit on main and match __version__.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: tag matches version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mediatools/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
