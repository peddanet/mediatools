<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>mediatools - social preview</title>
  <!-- source of docs/images/social-preview.png (1280x640); rebuild with:
       rsvg-convert -w 1280 -h 640 docs/images/social-preview.svg -o docs/images/social-preview.png -->
  <rect width="1280" height="640" fill="#f4f6f9"/>
  <rect y="600" width="1280" height="40" fill="#1b3f6b"/>
  <g transform="translate(110,172) scale(1.15)">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fb3"/>
      <stop offset="1" stop-color="#1b3f6b"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bg)"/>
  <!-- film strip -->
  <rect x="52" y="64" width="152" height="128" rx="10" fill="#f4f6f9"/>
  <g fill="#1b3f6b">
    <rect x="60" y="72" width="14" height="12" rx="2"/>
    <rect x="60" y="100" width="14" height="12" rx="2"/>
    <rect x="60" y="128" width="14" height="12" rx="2"/>
    <rect x="60" y="156" width="14" height="12" rx="2"/>
    <rect x="182" y="72" width="14" height="12" rx="2"/>
    <rect x="182" y="100" width="14" height="12" rx="2"/>
    <rect x="182" y="128" width="14" height="12" rx="2"/>
    <rect x="182" y="156" width="14" height="12" rx="2"/>
  </g>
  <!-- inward arrows: shrink -->
  <g fill="#f08c2e">
    <path d="M86 128 l26 -22 v12 h10 v20 h-10 v12 z" transform="rotate(180 104 128)"/>
    <path d="M170 128 l-26 -22 v12 h-10 v20 h10 v12 z" transform="rotate(180 152 128)"/>
  </g>
  <rect x="122" y="96" width="12" height="64" rx="3" fill="#f08c2e"/>
</g>
  <text x="460" y="290" font-family="DejaVu Sans, sans-serif" font-size="96" font-weight="bold" fill="#1b3f6b">mediatools</text>
  <text x="464" y="360" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#2f6fb3">Shrink, review, flatten and back up</text>
  <text x="464" y="404" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#2f6fb3">media collections - crash-safe, resumable</text>
  <text x="464" y="470" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#555">command line and Tk GUI for Linux</text>
</svg>
